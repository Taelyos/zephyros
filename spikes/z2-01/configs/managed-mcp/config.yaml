# A managed-scope file that carries the MCP server too, to measure what the managed scope covers.
model:
  provider: custom
  default: ${ZEPHYROS_MODEL}
  base_url: ${ZEPHYROS_HUB_URL}/v1
  api_key: ${ZEPHYROS_TOKEN}
mcp_servers:
  zephyros:
    url: ${ZEPHYROS_HUB_URL}/mcp
    headers:
      Authorization: "Bearer ${ZEPHYROS_TOKEN}"
tools:
  tool_search:
    enabled: "off"
