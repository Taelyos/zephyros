# the seed plus a context length, to see whether Hermes then stops probing the model endpoint
model:
  provider: custom
  default: ${ZEPHYROS_MODEL}
  base_url: ${ZEPHYROS_HUB_URL}/v1
  api_key: ${ZEPHYROS_TOKEN}
  context_length: 128000
mcp_servers:
  zephyros:
    url: ${ZEPHYROS_HUB_URL}/mcp
    headers:
      Authorization: "Bearer ${ZEPHYROS_TOKEN}"
tools:
  tool_search:
    enabled: "off"
