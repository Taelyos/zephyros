# the gateway with only the webhook platform: the one inbound path Hermes offers for pushing work
model:
  provider: custom
  default: ${ZEPHYROS_MODEL}
  base_url: ${ZEPHYROS_HUB_URL}/v1
  api_key: ${ZEPHYROS_TOKEN}
mcp_servers:
  zephyros:
    url: ${ZEPHYROS_HUB_URL}/mcp
    headers:
      Authorization: "Bearer ${ZEPHYROS_TOKEN}"
tools:
  tool_search:
    enabled: "off"
platforms:
  webhook:
    enabled: true
    extra:
      port: 8644
      host: 0.0.0.0
      secret: spike-webhook-secret  # pragma: allowlist secret
      routes:
        task:
          secret: spike-webhook-secret  # pragma: allowlist secret
          prompt: "Task: {text}"
          deliver: log
