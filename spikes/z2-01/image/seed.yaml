# Seed of the instance configuration, copied over $HERMES_HOME/config.yaml at every start.
# ${VAR} is expanded from the process environment; the project token is the only secret.
model:
  provider: custom
  default: ${ZEPHYROS_MODEL}
  base_url: ${ZEPHYROS_HUB_URL}/v1
  api_key: ${ZEPHYROS_TOKEN}
mcp_servers:
  zephyros:
    url: ${ZEPHYROS_HUB_URL}/mcp
    headers:
      Authorization: "Bearer ${ZEPHYROS_TOKEN}"
tools:
  tool_search:
    enabled: "off"
