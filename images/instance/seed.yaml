# Seed of the instance configuration, copied over $HERMES_HOME/config.yaml at every start.
# ${VAR} is expanded from the environment of the turn; the project token is the only secret.
# The model gateway and the MCP server of the hub are at the same address: the agent endpoint,
# which the network guard lets through at every level (ADR 0024).
model:
  provider: custom
  default: ${ZEPHYROS_MODEL}
  base_url: ${ZEPHYROS_HUB_URL}/v1
  api_key: ${ZEPHYROS_TOKEN}
  streaming: false
mcp_servers:
  zephyros:
    url: ${ZEPHYROS_HUB_URL}/mcp
    headers:
      Authorization: "Bearer ${ZEPHYROS_TOKEN}"
tools:
  tool_search:
    enabled: "off"
# An instance continues its conversation from turn to turn (ADR 0016). Hermes compacts it past
# this many tokens: the third real run's Contractor reached 188 000 tokens a call, and each call
# took longer than the last. The hub holds the state that matters (contract, deliveries).
compression:
  threshold_tokens: 80000
# No review of the turn after it ends: Hermes' automatic background review is one more call
# with the whole conversation (145 000 tokens in the third real run, after the hub had ended the
# turn), and it writes the instance's own memories and skills from what the turn read — content
# the hub treats as untrusted.
auxiliary:
  background_review:
    enabled: false
